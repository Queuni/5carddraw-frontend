<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

  <title>5 Card Draw</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <meta
    name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no"
  />

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #231f20;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #231f20;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #1c1a1b, #2a2628);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    #loading-logo {
      width: 220px;
      max-width: 60%;
      margin-bottom: 30px;
    }

    #progress-container {
      width: 280px;
      max-width: 70%;
      height: 10px;
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      overflow: hidden;
    }

    #progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #e6c15a, #f5d77a);
      transition: width 0.2s ease;
    }

    #progress-text {
      margin-top: 12px;
      font-size: 13px;
      color: rgba(255,255,255,0.75);
    }

    .title {
      font-size: 28px;
      margin-bottom: 16px;
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- LOADING SCREEN -->
  <div id="loading-overlay" class="overlay">
    <img id="loading-logo" src="logo_300.png" alt="5 Card Draw" />
    <div id="progress-container">
      <div id="progress-bar"></div>
    </div>
    <div id="progress-text">Loading…</div>
  </div>

  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <script>
    /* =============================
       BUILD CONFIG (CHANGE PER BUILD)
       ============================= */
    const BUILD_VERSION = "1.0.2";
    const BUILD_FOLDER  = "Build_1_0_2";
    const VERSION_KEY   = "five-card-draw-version";

    const loadingOverlay = document.getElementById("loading-overlay");

    const storedVersion = localStorage.getItem(VERSION_KEY);

    if (storedVersion && storedVersion !== BUILD_VERSION) {
      try { indexedDB.deleteDatabase("UnityCache"); } catch (e) {}

      localStorage.setItem(VERSION_KEY, BUILD_VERSION);
      setTimeout(() => location.reload(true), 800);
    } else {
      localStorage.setItem(VERSION_KEY, BUILD_VERSION);
      loadUnity();
    }

    function loadUnity() {
      const script = document.createElement("script");
      script.src = `${BUILD_FOLDER}/WebGL.loader.js`;
      script.onload = startUnity;
      document.body.appendChild(script);
    }

    function startUnity() {
      const canvas = document.getElementById("unity-canvas");
      const bar = document.getElementById("progress-bar");
      const text = document.getElementById("progress-text");

      createUnityInstance(
        canvas,
        {
          dataUrl: `${BUILD_FOLDER}/WebGL.data.gz`,
          frameworkUrl: `${BUILD_FOLDER}/WebGL.framework.js.gz`,
          codeUrl: `${BUILD_FOLDER}/WebGL.wasm.gz`,
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Belle View Best",
          productName: "5 Card Draw",
          productVersion: BUILD_VERSION,
          matchWebGLToCanvasSize: true,
          devicePixelRatio: window.devicePixelRatio || 1
        },
        (progress) => {
          const p = Math.round(progress * 100);
          bar.style.width = p + "%";
          text.textContent = "Loading... " + p + "%";
        }
      ).then(() => {
        loadingOverlay.classList.add("hidden");
        setTimeout(() => loadingOverlay.remove(), 600);
      });
    }
  </script>

</body>
</html>
